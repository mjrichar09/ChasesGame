name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # The whole simulation runs in Node, so this covers kart physics, laps,
      # items and a full AI race without a GPU.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
